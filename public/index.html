<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commander Deckbuilder</title>
<link rel="stylesheet" href="style.css">

<div class="home">
  <h1>I miei mazzi Commander</h1>

  <form id="new">
    <input name="name" placeholder="Nome del nuovo mazzo" required autofocus>
    <button>Crea</button>
  </form>

  <details id="import-box">
    <summary>Importa da Moxfield</summary>
    <form id="import">
      <input name="name" placeholder="Nome del mazzo" required>
      <textarea name="list" rows="10" required
        placeholder="1 Inalla, Archmage Ritualist (SLD) 1639&#10;1 Sol Ring (EOC) 57&#10;5 Island (SNC) 264"></textarea>
      <button>Importa</button>
      <p id="import-status" class="empty"></p>
    </form>
  </details>

  <div id="list"></div>
</div>

<script type="module">
  import { api, post, del } from "./api.js";
  import { eur, parseMoxfield, resolvePrintings } from "./app.js";

  const list = document.getElementById("list");

  async function load() {
    const decks = await api("/decks"); // conteggi e totali già calcolati in SQL
    if (!decks.length) return (list.innerHTML = "<p class='empty'>Nessun mazzo. Creane uno qui sopra.</p>");

    list.innerHTML = "";
    for (const d of decks) {
      const el = document.createElement("a");
      el.className = "deck-item";
      el.href = `deck.html?id=${d.id}`;
      el.innerHTML = `<strong>${d.name}</strong>
        <span class="cost">${d.cards} carte · ${d.purchased} acquistate</span>
        <span class="cost price">${eur(d.total)}</span>
        <button class="del" title="Elimina mazzo">×</button>`;
      el.querySelector(".del").onclick = (e) => {
        e.preventDefault();
        if (confirm(`Eliminare "${d.name}" e le sue ${d.cards} carte?`)) del(`/decks/${d.id}`).then(load);
      };
      list.append(el);
    }
  }

  document.getElementById("new").onsubmit = async (e) => {
    e.preventDefault();
    const name = e.target.name.value.trim();
    if (!name) return;
    const deck = await post("/decks", { name });
    location.href = `deck.html?id=${deck.id}`;
  };

  document.getElementById("import").onsubmit = async (e) => {
    e.preventDefault();
    const status = document.getElementById("import-status");
    const btn = e.target.querySelector("button");
    const { cards, skipped } = parseMoxfield(e.target.list.value);
    if (!cards.length) return (status.textContent = "Nessuna riga riconosciuta.");

    btn.disabled = true;
    status.textContent = `Cerco ${cards.length} carte su Scryfall…`;
    try {
      const { rows, missing } = await resolvePrintings(cards);
      if (!rows.length) throw new Error("nessuna carta risolta");

      const deck = await post("/decks", { name: e.target.name.value.trim() });
      await post(`/decks/${deck.id}/cards`, rows);

      // se qualcosa non è stato importato l'utente deve saperlo prima di andarsene
      const lost = [...missing.map((m) => m.name), ...skipped];
      if (lost.length && !confirm(`Importate ${rows.length} righe su ${cards.length}.\n\nNon riconosciute:\n${lost.join("\n")}\n\nApro il mazzo?`)) {
        btn.disabled = false;
        return load();
      }
      location.href = `deck.html?id=${deck.id}`;
    } catch (err) {
      status.textContent = `Import fallito: ${err.message}`;
      btn.disabled = false;
    }
  };

  load();
</script>
